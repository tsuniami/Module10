<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SneakerPapi - New Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Upper Right Logo -->
    <img src="Logo.png" alt="SneakerPapi Logo" class="top-logo">

    <h1>New Order</h1>

    <h2>Order Form</h2>
    <form id="orderForm">

        <p>
            <label for="customerName">Customer Name:</label><br>
            <input type="text" id="customerName" required maxlength="60" placeholder="Juan Dela Cruz">
        </p>

        <p>
            <label for="orderType">Order Type:</label><br>
            <select id="orderType">
                <option value="Walk-In">Walk-In</option>
                <option value="Online" selected>Online</option>
            </select>
        </p>

        <div class="field-row">
            <p>
                <label for="itemCode">Selected Item:</label><br>
                <select id="itemCode"></select>
            </p>
            <p style="flex:0 1 160px;">
                <label for="quantity">Quantity:</label><br>
                <input type="number" id="quantity" min="1" max="99" step="1" value="1" required placeholder="1">
            </p>
        </div>

        <div class="btn-row">
            <button type="submit">Add Item to Cart</button>
            <button type="button" class="ghost" id="clearCartBtn">Clear Cart</button>
        </div>
    </form>

    <h2>Selected Items</h2>
    <div class="panel" id="cartPanel"></div>

    <h2>Order Confirmation</h2>
    <div id="outputContainer"></div>

    <script src="module10.js"></script>
</body>
</html>
